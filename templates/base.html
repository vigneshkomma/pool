{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Carry{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
    <script src="{% static 'vendor/cdn.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="bg-gray-50 text-gray-900 min-h-screen">

    <nav class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
        <a href="{% url 'home:home_page' %}" class="font-semibold text-lg">Carry</a>
        <div class="flex items-center gap-4 text-sm">
            {% if user.is_authenticated %}
                <a href="{% url 'projects:list' %}" class="text-gray-600 hover:text-gray-900">Projects</a>
                <a href="{% url 'accounts:profile' %}" class="text-gray-600 hover:text-gray-900">Profile</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="text-gray-600 hover:text-gray-900">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="text-gray-600 hover:text-gray-900">Login</a>
                <a href="{% url 'accounts:signup' %}" class="bg-gray-900 text-white px-3 py-1.5 rounded-md hover:bg-gray-700">Sign up</a>
            {% endif %}
        </div>
    </nav>

    {% if messages %}
        <div class="max-w-3xl mx-auto mt-4 px-6">
            {% for message in messages %}
                <div class="bg-blue-50 text-blue-800 text-sm px-4 py-2 rounded-md mb-2">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="max-w-3xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
