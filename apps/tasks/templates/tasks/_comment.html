<div id="comment-{{ comment.pk }}" class="bg-white border border-gray-200 rounded-lg px-4 py-3">
    <p class="text-sm font-medium">{{ comment.author }} <span class="text-gray-400 font-normal">— {{ comment.created_at }}</span></p>
    <p class="text-sm text-gray-700 mt-1">{{ comment.content }}</p>
</div>
