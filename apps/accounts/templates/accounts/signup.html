{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
    <div class="max-w-sm mx-auto bg-white border border-gray-200 rounded-lg p-6">
        <h1 class="text-xl font-semibold mb-4">Sign Up</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-600 text-xs mt-1">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-gray-900 text-white py-2 rounded-md hover:bg-gray-700">Create Account</button>
        </form>
        <p class="text-sm text-gray-600 mt-4">
            Already have an account? <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">Log in</a>
        </p>
    </div>
{% endblock %}
