server {
    listen 80;
    server_name poolapp.duckdns.org; # Replace with your domain or IP

    location / {
        # 'poolapp' will be the Docker container name for App 2
        proxy_pass http://poolapp:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}